name: UNIBIC GitHub Release to Neon Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unibic-neon-release-refresh.yml
  release:
    types: [published]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: unibic-neon-release-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install importer dependencies
        run: npm install --no-save --no-audit --no-fund exceljs@4.4.0 xlsx@0.18.5 pg@8.16.3
      - name: Import latest GSV and LIVE SOH release assets into Neon
        env:
          SHARED_CACHE_DATABASE_URL: ${{ secrets.SHARED_CACHE_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node shared-cache/import-release-to-neon.js
