name: Refresh Neon shared cache

on:
  workflow_dispatch:
  schedule:
    # Daily safety check in case an existing release asset is replaced
    # without a release-published event.
    - cron: "17 3 * * *"
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: neon-shared-cache-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout importer
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save exceljs@4.4.0 xlsx@0.18.5 pg@8.16.3

      - name: Import latest GitHub Release into Neon
        env:
          SHARED_CACHE_DATABASE_URL: ${{ secrets.SHARED_CACHE_DATABASE_URL }}
        run: node shared-cache/import-release-to-neon.js
