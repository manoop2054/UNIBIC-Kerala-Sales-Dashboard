name: Employee Access Control tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'employee-access-control/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/employee-access-control-tests.yml'
  push:
    branches: ['integration/employee-access-control-main-20261021']
    paths:
      - 'employee-access-control/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/employee-access-control-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
