<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIBIC Kerala Sales Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">/* ===== FINAL HTML FIX: preserve backup dashboard, repair API + missing functions ===== */

function money(v){var n=num(v);return Number.isFinite(n)?n.toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2}):'0'}
function money2(v){
  return money(v);
}

function exportRows(rows,name='UNIBIC_Report'){
  try{
    if(!window.XLSX){
      toast('Excel library not loaded');
      return;
    }
    const ws=XLSX.utils.json_to_sheet(rows||[]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Report');
    XLSX.writeFile(wb,name+'.xlsx');
    toast('Excel exported');
  }catch(e){
    console.error('Export error:',e);
    toast('Export failed');
  }
}

function renderDBR(){
  return;
}

function renderInvoice(){
  const dbr=$('invDbr')?.value||'';
  const cust=$('invCustomer')?.value||'';
  const inv=$('invNo')?.value||'';
  const q=($('invSearch')?.value||'').toLowerCase().trim();

  const rows=activeRows.filter(r=>{
    if(dbr && String(r.__dbrCode||'').trim()!==dbr) return false;
    if(cust && r.__customer!==cust) return false;
    if(inv && r.__invoice!==inv) return false;
    if(q){
      const z=[r.__invoice,r.__customer,r.__itemCode,r.__desc].join(' ').toLowerCase();
      if(!z.includes(q)) return false;
    }
    return true;
  });

  if($('invoiceTable')){$('invoiceTable').innerHTML=rows.slice(0,10000).map(r=>`<tr>
      <td>${esc(r.__dbrCode)}</td>
      <td>${esc(r.__dbrName)}</td>
      <td>${esc(r.__customer)}</td>
      <td>${esc(r.__invoice)}</td>
      <td>${esc(r.__order)}</td>
      <td>${esc(fmtDate(r.__date))}</td>
      <td>${esc(r.__itemCode)}</td>
      <td>${esc(r.__desc)}</td>
      <td class="money">${num(r.__pcs).toLocaleString('en-IN')}</td>
      <td class="money">${num(r.__cbb).toLocaleString('en-IN',{maximumFractionDigits:1})}</td>
      <td class="money">${money(r.__gsv)}</td>
      <td class="money">${money(r.__disc)}</td>
    </tr>`).join('') || '<tr><td colspan="12" class="empty">No invoice data.</td></tr>';
  }
}

function renderAlerts(){
  const box=$('alertsList');
  if(!box) return;

  const sales=activeRows||[];
  const stock=soh||[];
  const alerts=[];
  const add=(level,title,text)=>alerts.push('<div class="alert '+level+'"><b>'+esc(title)+'</b><br>'+text+'</div>');
  const moneyTxt=v=>money(num(v));

  const total=sales.length;
  const inv=new Set(sales.map(r=>r.__invoice).filter(Boolean)).size;
  const zeroGsv=sales.filter(r=>!num(r.__gsv)).length;
  const negIndv=sales.filter(r=>num(r.__disc)<0).length;

  add(total?'good':'warn','Sales Data',total.toLocaleString('en-IN')+' rows loaded from '+esc(salesSource)+'.');
  add(zeroGsv?'warn':'good','Zero GSV Rows',zeroGsv.toLocaleString('en-IN')+' rows.');
  add(negIndv?'warn':'good','Negative INDV Rows',negIndv.toLocaleString('en-IN')+' rows.');
  add('good','Invoices',inv.toLocaleString('en-IN')+' distinct invoices.');

  const latest=sales.map(r=>r.__date).filter(Boolean).sort((a,b)=>b-a)[0];

  if(latest){
    const cy=latest.getFullYear(),cm=latest.getMonth();
    const cur=sales.filter(r=>r.__date&&r.__date>=new Date(cy,cm,1)&&r.__date<new Date(cy,cm+1,1));
    const prev=sales.filter(r=>r.__date&&r.__date>=new Date(cy,cm-1,1)&&r.__date<new Date(cy,cm,1));

    const cg=cur.reduce((s,r)=>s+num(r.__gsv),0);
    const pg=prev.reduce((s,r)=>s+num(r.__gsv),0);
    const cc=cur.reduce((s,r)=>s+num(r.__cbb),0);
    const pc=prev.reduce((s,r)=>s+num(r.__cbb),0);

    if(pg>0){
      const gp=(cg-pg)/pg*100;
      add(gp<=-10?'warn':'good','GSV vs Previous Month',gp.toFixed(1)+'% | '+moneyTxt(cg)+' vs '+moneyTxt(pg));
    }

    if(pc>0){
      const cp=(cc-pc)/pc*100;
      add(cp<=-10?'warn':'good','CBB vs Previous Month',cp.toFixed(1)+'% | '+cc.toLocaleString('en-IN')+' vs '+pc.toLocaleString('en-IN'));
    }

    const curDbr=new Set(cur.map(r=>r.__dbrCode||r.__dbrName).filter(Boolean));
    const prevDbr=[...new Set(prev.map(r=>r.__dbrCode||r.__dbrName).filter(Boolean))];
    const inactive=prevDbr.filter(d=>!curDbr.has(d)).slice(0,5);
    if(inactive.length)add('warn','Inactive DBR',inactive.map(esc).join(', ')+(prevDbr.length>5?' ...':''));

    const dbMap=new Map();
    sales.forEach(r=>{
      const k=r.__dbrCode||r.__dbrName||'Unspecified';
      dbMap.set(k,(dbMap.get(k)||0)+num(r.__gsv));
    });
    const dbTop=[...dbMap.entries()].sort((a,b)=>b[1]-a[1])[0];
    const allG=sales.reduce((s,r)=>s+num(r.__gsv),0);
    if(dbTop&&allG>0&&dbTop[1]/allG*100>=50)
      add('warn','High DBR Concentration',esc(dbTop[0])+' = '+(dbTop[1]/allG*100).toFixed(1)+'% of total GSV');

    const highDisc=sales.reduce((s,r)=>s+Math.abs(num(r.__disc)),0);
    if(highDisc)add('warn','INDV Discount Exposure',moneyTxt(highDisc)+' total absolute INDV discount');

    const returnDisc=sales.filter(r=>r.__returnInvoice).reduce((s,r)=>s+num(r.__disc),0);
    if(returnDisc)add('warn','Return Invoice Impact',moneyTxt(returnDisc)+' INDV linked to return invoices');

    const base=sales.reduce((s,r)=>s+Math.abs(num(r.__gstBase)),0);
    const discRate=base?highDisc/base*100:0;
    if(discRate>=5)add('warn','Unusual Discount %',discRate.toFixed(2)+'% of GST base');
  }

  const mainStock=stock.filter(x=>String(x.TYPE||'').toUpperCase()==='SOH');
  const transit=stock.filter(x=>String(x.TYPE||'').toUpperCase()==='INTRANSIT');
  const stockCbb=x=>num(x.TOTAL_MAIN_QRT||x.CBB||x.CBO);

  const qUnits=mainStock.reduce((s,x)=>s+num(x.QUARANTINE_QTY_CBO),0);
  const near=mainStock.filter(x=>stockCbb(x)<=10).length;
  const expiry=mainStock.filter(x=>{const n=num(x.REMAININGSHELFLIFE);return n>0&&n<=30}).length;
  const inQty=transit.reduce((s,x)=>s+stockCbb(x),0);

  if(near)add('warn','Stock Out / Near Stock Out',near.toLocaleString('en-IN')+' stock rows at or below 10 CBB');
  else add('good','Stock Availability','No immediate near-stock-out rows');

  if(expiry)add('warn','Expiry Risk',expiry.toLocaleString('en-IN')+' stock rows with remaining shelf life <= 30 days');
  if(qUnits)add('warn','Quarantine Stock',qUnits.toLocaleString('en-IN',{maximumFractionDigits:1})+' CBB quarantine quantity');
  if(inQty)add('warn','INTRANSIT Pending',inQty.toLocaleString('en-IN',{maximumFractionDigits:1})+' CBB currently in transit');

  box.innerHTML=alerts.join('');
}

async function loadLiveData(){
  setStatus('Loading GSV...',false);

  try{
    const r=await fetch('/api/gsv',{cache:'no-store'});
    if(!r.ok) throw new Error('GSV API HTTP '+r.status);

    const d=await r.json();
    gsvRows=payloadRows(d).map(norm);
    activeRows=gsvRows;

    try{
      const q=await fetch('/api/soh',{cache:'no-store'});
      if(!q.ok) throw new Error('SOH API HTTP '+q.status);
      const x=await q.json();
      soh=payloadRows(x);
      filteredSOH=soh.slice();
    }catch(e){
      console.warn('SOH load failed:',e);
      soh=[];
      filteredSOH=[];
    }

    try{
      populateFilters();
      rebuildFilters();
      renderAll();
      renderReportTabs();
      renderReport();
    }catch(e){
      console.error('Dashboard rendering error:',e);
    }

    setStatus('Connected',false);

    if($('last')){$('last').textContent='Last refresh: '+new Date().toLocaleString('en-IN');
    }

  }catch(e){
    console.error('Dashboard API error:',e);
    setStatus('Connection failed',false);
  }
}

function norm(r){
  const x={...r};
  x.__date=dateVal(field(r,['PostingDate','Posting Date','Date','Invoice Date']));
  x.__gsv=num(field(r,['GSV IN LAKH','GSV','GSV Amount','AmountToCustomer']));
  if(r['GSV IN LAKH']!==undefined) x.__gsv=num(r['GSV IN LAKH'])*100000;
  x.__cbb=num(field(r,['QuantityinCBO','Quantity in CBO','CBB','CBO']));
  x.__pcs=num(field(r,['QuantityinPcs','Quantity in Pcs','Qty PCS','Quantity']));
  x.__disc=num(field(r,['INDV_discount','INDV Discount','Discount','INDV Amount']));
  x.__dbrCode=String(field(r,['DBR_Code','DBR Code','Sell_to_Customer_No','Customer_Account','Billed_to_Code'])||'').trim();
  x.__dbrName=String(field(r,['DBR_Name','DBR Name','Sell_to_Customer_Name'])||'').trim();
  x.__customer=String(field(r,['Customer_Name','Customer','Billed_to_Name','Ship_to_Name','Sell_to_Customer_Name'])||x.__dbrName).trim();
  x.__itemCode=String(field(r,['ItemId','Item ID','Item Code','ItemCode'])||'').trim();
  x.__desc=String(field(r,['Description','Item Description'])||'').trim();
  x.__invoice=String(field(r,['Invoice_No','Invoice No','Invoice'])||'').trim();
  x.__order=String(field(r,['Order_No','Order No','Order'])||'').trim();
  x.__abm=String(field(r,['NKAM_ABM','ABM'])||'').trim();
  x.__anchor=String(field(r,['AnchorName','Anchor'])||'').trim();
  x.__brand=String(field(r,['Brand','BrandName'])||'').trim();
  x.__monthKey=monthKey(x.__date);
  return x;
}
</script>
<style>
:root{--navy:#0b1f3a;--blue:#1769e0;--cyan:#00a7c7;--green:#159a6a;--orange:#ef8b20;--red:#d94b4b;--purple:#7057d9;--bg:#f4f7fb;--card:#fff;--text:#16263d;--muted:#6f7f95;--line:#e4eaf2;--shadow:0 8px 24px rgba(11,31,58,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:linear-gradient(180deg,#091a31,#102b4e);color:#fff;padding:22px 14px;overflow:auto}
.main{margin-left:245px;width:calc(100% - 245px);padding:22px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}
.status{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.ok{background:#17b77a}.dot.bad{background:#d94b4b}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:11px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.section{display:none}.section.active{display:block}
.filters{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:15px}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:11px;padding:13px;box-shadow:var(--shadow)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:15px}
.chart{height:270px}
</style>
</head>

</div>
<script>
const GSV_API='/api/gsv', SOH_API='/api/soh';
document.addEventListener('DOMContentLoaded', loadLiveData);
